name: Sync

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download the formula from the latest strata release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo Ross-cripto/strata --pattern strata.rb --dir Formula --clobber
      - name: Commit it when it changed
        run: |
          git add Formula/strata.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          version=$(sed -n 's/^ *version "\(.*\)"$/\1/p' Formula/strata.rb | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "strata ${version}"
          git push
